name: Generate Short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for the YouTube Short"
        required: true
        default: "Amazing space facts"
      duration:
        description: "Target length in seconds (22-45 works best)"
        required: false
        default: "32"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-lato fonts-liberation

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Short (no API keys)
        run: python main.py --topic "${{ github.event.inputs.topic }}" --duration ${{ github.event.inputs.duration }}

      - name: Prepare download folder
        run: |
          set -e
          mkdir -p youtube-upload
          VIDEO=$(find output -name video.mp4 | head -n 1)
          test -n "$VIDEO"
          RUNDIR=$(dirname "$VIDEO")
          cp "$VIDEO" youtube-upload/video.mp4
          cp "$RUNDIR/title.txt" youtube-upload/youtube-title.txt
          cp "$RUNDIR/description.txt" youtube-upload/youtube-description.txt
          if [ -f "$RUNDIR/hashtags.txt" ]; then
            cp "$RUNDIR/hashtags.txt" youtube-upload/youtube-hashtags.txt
          else
            grep -oE '#[A-Za-z0-9_]+' "$RUNDIR/description.txt" | tr '\n' ' ' > youtube-upload/youtube-hashtags.txt || true
            echo >> youtube-upload/youtube-hashtags.txt
          fi
          cp "$RUNDIR/tags.txt" youtube-upload/youtube-tags.txt || true
          {
            echo "Topic: ${{ github.event.inputs.topic }}"
            echo "On iPhone: tap the download, then tap video.mp4 to play it."
            echo "youtube-title.txt = YouTube title"
            echo "youtube-description.txt = YouTube description"
            echo "youtube-hashtags.txt = hashtags"
          } > youtube-upload/README.txt
          ls -lh youtube-upload
          echo "----- TITLE -----"
          cat youtube-upload/youtube-title.txt

      - name: Upload Short files
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: youtube-upload/*
          if-no-files-found: error

      - name: Upload video only
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: youtube-upload/video.mp4
          if-no-files-found: error
