name: Generate Short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prompt / category / random / simulation"
        required: true
        type: choice
        default: prompt
        options: [prompt, category, random, simulation]
      category:
        description: "Minecraft category"
        required: false
        type: choice
        default: items
        options: [crystal-pvp, pvp, redstone, nether, end, enchanting, mobs, items, building, simulation]
      simulation_type:
        description: "Simulation type"
        required: false
        type: choice
        default: colorfight
        options: [grow, shrink, squeeze, colorfight, paint, merge, king, swarm, spawn, rings, race, split, random]
      sim_shape:
        description: "Arena shape"
        required: false
        type: choice
        default: circle
        options: [circle, square, triangle, hexagon]
      sim_speed:
        description: "Ball speed"
        required: false
        type: choice
        default: fast
        options: [slow, normal, fast]
      sim_colors:
        description: "Colour set"
        required: false
        type: choice
        default: neon
        options: [neon, rainbow, two-tone]
      sim_music:
        description: "Background music + bounce clicks"
        required: false
        type: choice
        default: on
        options: [on, off]
      topic:
        description: "Prompt text (mode=prompt)"
        required: false
        default: "Minecraft totem of undying"
      duration:
        description: "Talking-video length. Sims end when the match is over."
        required: false
        default: "34"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-lato fonts-liberation
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Short (no API keys)
        run: |
          python main.py --mode "${{ github.event.inputs.mode }}" --category "${{ github.event.inputs.category }}" --simulation-type "${{ github.event.inputs.simulation_type }}" --sim-shape "${{ github.event.inputs.sim_shape }}" --sim-speed "${{ github.event.inputs.sim_speed }}" --sim-colors "${{ github.event.inputs.sim_colors }}" --sim-music "${{ github.event.inputs.sim_music }}" --topic "${{ github.event.inputs.topic }}" --duration ${{ github.event.inputs.duration }}
      - name: Prepare download folder
        run: |
          set -e
          mkdir -p youtube-upload
          VIDEO=$(find output -name video.mp4 | head -n 1)
          test -n "$VIDEO"
          RUNDIR=$(dirname "$VIDEO")
          cp "$VIDEO" youtube-upload/video.mp4
          cp "$RUNDIR/title.txt" youtube-upload/youtube-title.txt
          cp "$RUNDIR/description.txt" youtube-upload/youtube-description.txt
          cp "$RUNDIR/hashtags.txt" youtube-upload/youtube-hashtags.txt || true
      - name: Upload Short files
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: youtube-upload/*
          if-no-files-found: error
      - name: Upload video only
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: youtube-upload/video.mp4
          if-no-files-found: error
