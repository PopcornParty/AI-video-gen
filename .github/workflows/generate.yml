name: Generate Short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "How to pick the topic. Use simulation for a silent visual."
        required: true
        type: choice
        default: prompt
        options:
          - prompt
          - category
          - random
          - simulation
      category:
        description: "Minecraft category"
        required: false
        type: choice
        default: items
        options:
          - crystal-pvp
          - pvp
          - redstone
          - nether
          - end
          - enchanting
          - mobs
          - items
          - building
          - simulation
      simulation_type:
        description: "Simulation type (only for mode/category = simulation)"
        required: false
        type: choice
        default: grow
        options:
          - grow
          - shrink
          - squeeze
          - swarm
          - spawn
          - box
          - triangle
          - rings
          - race
          - gravity
      topic:
        description: "Your Minecraft prompt (used when mode is prompt)"
        required: false
        default: "Minecraft totem of undying"
      duration:
        description: "Video length in seconds"
        required: false
        default: "34"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-lato fonts-liberation

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Short (no API keys)
        run: |
          python main.py --mode "${{ github.event.inputs.mode }}" --category "${{ github.event.inputs.category }}" --simulation-type "${{ github.event.inputs.simulation_type }}" --topic "${{ github.event.inputs.topic }}" --duration ${{ github.event.inputs.duration }}

      - name: Prepare download folder
        run: |
          set -e
          mkdir -p youtube-upload
          VIDEO=$(find output -name video.mp4 | head -n 1)
          test -n "$VIDEO"
          RUNDIR=$(dirname "$VIDEO")
          cp "$VIDEO" youtube-upload/video.mp4
          cp "$RUNDIR/title.txt" youtube-upload/youtube-title.txt
          cp "$RUNDIR/description.txt" youtube-upload/youtube-description.txt
          if [ -f "$RUNDIR/hashtags.txt" ]; then
            cp "$RUNDIR/hashtags.txt" youtube-upload/youtube-hashtags.txt
          else
            echo "#Shorts #satisfying #simulation" > youtube-upload/youtube-hashtags.txt
          fi
          {
            echo "Mode: ${{ github.event.inputs.mode }}"
            echo "Simulation: ${{ github.event.inputs.simulation_type }}"
            echo "Duration: ${{ github.event.inputs.duration }}"
          } > youtube-upload/README.txt

      - name: Upload Short files
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: youtube-upload/*
          if-no-files-found: error

      - name: Upload video only
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: youtube-upload/video.mp4
          if-no-files-found: error
